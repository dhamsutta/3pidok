        <h1>จริยาปิฎก</h1>
<p><a href="/">หน้าแรก</a> > จริยาปิฎก
<hr style="border: 1px solid #e6e6e6;"> 

<div class="page-wrapper">
จริยาปิฎกเป็นคัมภีร์สุดท้ายของขุททกนิกายที่บันทึกเรื่องราว การบำเพ็ญบารมี ๑๐ ประการ ของพระโพธิสัตว์ในอดีตก่อนตรัสรู้เป็นพระพุทธเจ้า
ทั้งหมดมี ๓๕ เรื่อง แบ่งออกเป็น ๓ หมวดหลัก ได้แก่:
<ul>
<li>ทานจริยา — เรื่องเกี่ยวกับการบำเพ็ญทานบารมี (๑๐ เรื่อง)</li>
<li>สีลจริยา — การรักษาศีลและประพฤติดี (๑๐ เรื่อง)</li>
<li>เนกขัมมจริยา เป็นต้น — การบำเพ็ญบารมีขั้นสูงอื่น ๆ (๑๕ เรื่อง)</li>
    </ul>

เรื่องราวทั้งหมดเน้นให้เห็นถึง ความเสียสละ ความอดทน และปัญญา ที่พระโพธิสัตว์ใช้ในการดำเนินชีวิต 
    เพื่อสะสมบารมีอันนำไปสู่การตรัสรู้เป็นพระสัมมาสัมพุทธเจ้า
