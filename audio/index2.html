<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ธรรมสุตตะ - Audio Playlist</title>
  <style>
    body {
      font-family: Tahoma, sans-serif;
      background: #f9f9f9;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    /* เฟรม */
    #player-frame {
      flex: 1;
      background: #ffffff;
      text-align: center;
      padding: 15px;
      border-bottom: 2px solid #ddd;
    }
    #playlist-frame {
      flex: 2;
      background: #eef7ef;
      padding: 15px;
      overflow-y: auto;
      border-bottom: 2px solid #ddd;
    }
    #menu-frame {
      flex: 1;
      background: #ffffff;
      padding: 15px;
      text-align: center;
    }
    /* ปุ่ม */
    button {
      background: #4CAF50;
      color: white;
      border: none;
      padding: 8px 15px;
      margin: 5px;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background: #45a049;
    }
    .track {
      padding: 10px;
      margin: 5px 0;
      background: #fff;
      border-radius: 5px;
      cursor: pointer;
    }
    .track:hover {
      background: #c8e6c9;
    }
  </style>
</head>
<body>

  <!-- เฟรม 3: Player -->
  <div id="player-frame">
    <h2 id="current-title">เลือกหัวข้อเพื่อเล่น</h2>
    <audio id="audio-player" controls>
      <source src="" type="audio/mpeg">
      เบราว์เซอร์ของคุณไม่รองรับ audio player
    </audio>
  </div>

  <!-- เฟรม 2: Playlist -->
  <div id="playlist-frame">
    <h3>Playlist</h3>
    <div id="playlist"></div>
  </div>

  <!-- เฟรม 1: เลือกหัวข้อ -->
  <div id="menu-frame">
    <h3>เลือกหมวดหัวข้อ</h3>
    <button onclick="loadPlaylist('ชุดพระพุทธเจ้า')">ชุดพระพุทธเจ้า</button>
    <button onclick="loadPlaylist('ชุดพระสูตร')">ชุดพระสูตร</button>
    <button onclick="loadPlaylist('ชุดพระวินัย')">ชุดพระวินัย</button>
  </div>

  <script>
    // ตัวอย่างข้อมูล playlist
    const playlists = {
      "ชุดพระพุทธเจ้า": [
        { title: "พระพุทธเจ้าผู้ทรงคุณ", src: "audio/buddha1.mp3" },
        { title: "พุทธวงศ์", src: "audio/buddha2.mp3" }
      ],
      "ชุดพระสูตร": [
        { title: "ธัมมจักกัปปวัตนสูตร", src: "audio/sutta1.mp3" },
        { title: "อนัตตลักขณสูตร", src: "audio/sutta2.mp3" }
      ],
      "ชุดพระวินัย": [
        { title: "ปาราชิก ๔", src: "audio/vinaya1.mp3" },
        { title: "สังฆาทิเสส ๑๓", src: "audio/vinaya2.mp3" }
      ]
    };

    const playlistDiv = document.getElementById("playlist");
    const audioPlayer = document.getElementById("audio-player");
    const currentTitle = document.getElementById("current-title");

    function loadPlaylist(name) {
      playlistDiv.innerHTML = "";
      playlists[name].forEach(track => {
        const div = document.createElement("div");
        div.className = "track";
        div.textContent = track.title;
        div.onclick = () => playTrack(track);
        playlistDiv.appendChild(div);
      });
    }

    function playTrack(track) {
      audioPlayer.src = track.src;
      currentTitle.textContent = track.title;
      audioPlayer.play();
    }
  </script>

</body>
</html>
