<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ธรรมะบรรยาย | พระอาจารย์สมบัติ นันทิโก</title>
    <meta name="description" content="บรรยายธรรมโดย พระอาจารย์สมบัติ นันทิโก">
    <meta name="keywords" content="พระอาจารย์สมบัติ นันทิโก, ธรรมะ, ธรรมะออนไลน์, เทศน์ธรรม, บรรยายธรรมตามพระไตรปิฎก">
    <meta name="author" content="พระอาจารย์สมบัติ นันทิโก" />

    <link rel="icon" type="image/png" href="/assets/images/favicon.png" sizes="140x140">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet" />
    
    <style>
        /* --- General and Reset Styles --- */
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #f7f9f7;
            color: #333;
            margin: 0;
            padding: 0;
            line-height: 1.7;
        }
        .container {
            max-width: 900px;
            margin: 20px auto;
            padding: 15px;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        /* --- Header Styles --- */
        .site-header {
            padding: 10px 20px;
            background-color: #fff;
            border-bottom: 1px solid #eee;
        }
        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }
        .logo-link {
            display: flex;
            align-items: center;
            text-decoration: none;
            color: #2e8b57;
        }
        .site-logo {
            height: 40px;
            margin-right: 10px;
        }
        .site-title {
            font-size: 1.5em;
            font-weight: 600;
        }

        /*
        ==============================================
        === CSS ที่จำเป็นสำหรับ HAMBURGER MENU (สำคัญ) ===
        ==============================================
        */
        .navbar#desktopNavbar {
            display: none; /* ซ่อนเมนูแนวนอนบน Mobile ก่อน */
        }
        .hamburger-icon {
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            width: 28px;
            height: 24px;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 0;
            z-index: 1001;
        }
        .hamburger-icon .bar {
            width: 100%;
            height: 3px;
            background-color: #333;
            border-radius: 5px;
            transition: all 0.3s ease-in-out;
        }
        /* Animation for hamburger to 'X' */
        .hamburger-icon.open .bar:nth-child(1) {
            transform: translateY(8px) rotate(45deg);
        }
        .hamburger-icon.open .bar:nth-child(2) {
            opacity: 0;
        }
        .hamburger-icon.open .bar:nth-child(3) {
            transform: translateY(-8px) rotate(-45deg);
        }

        /* Sidebar Menu Styles */
        .sidebar-menu {
            height: 100%;
            width: 250px;
            position: fixed;
            top: 0;
            left: -250px; /* ซ่อนเมนูไว้นอกจอด้านซ้าย */
            background-color: #2e8b57;
            padding-top: 60px;
            transition: left 0.3s ease-in-out;
            z-index: 1000;
            box-shadow: 2px 0 5px rgba(0,0,0,0.2);
        }
        /* State when menu is open */
        .sidebar-menu.open {
            left: 0; /* เลื่อนเมนูเข้ามาในจอ */
        }
        .sidebar-menu a {
            padding: 12px 20px;
            text-decoration: none;
            font-size: 18px;
            color: #f1f1f1;
            display: block;
            transition: background-color 0.3s;
        }
        .sidebar-menu a:hover {
            background-color: #256d45;
        }
        /* ============================================== */


        /* --- Player and Playlist Styles --- */
        .page-header h1, .page-header p {
            text-align: center;
            color: #2e8b57;
        }
        .page-header p {
            color: #555;
            margin-top: -10px;
        }
        .main-player-section {
            display: flex;
            gap: 25px;
            padding: 25px;
            background-color: #e8f5e9;
            border-radius: 8px;
            margin-top: 20px;
            align-items: center;
        }
        .album-art img {
            width: 150px;
            height: 150px;
            border-radius: 8px;
            object-fit: cover;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .player-info h2 { font-size: 1.6em; color: #1b5e20; margin: 0 0 5px; }
        .player-info p { margin: 0 0 15px; color: #4caf50; font-weight: 500; }
        #audioPlayer { width: 100%; }

        .playlist-section { margin-top: 30px; }
        .tab-container { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid #ddd; padding-bottom: 15px; }
        .tab-link { padding: 10px 20px; cursor: pointer; border: 1px solid #ccc; background-color: #f1f1f1; border-radius: 20px; font-size: 1em; transition: all 0.3s; }
        .tab-link:hover { background-color: #e0e0e0; }
        .tab-link.active { background-color: #2e8b57; color: white; border-color: #2e8b57; font-weight: 600; }
        #playlist-view { max-height: 400px; overflow-y: auto; padding-right: 10px; }
        .playlist-item { display: flex; align-items: center; padding: 12px 10px; border-bottom: 1px solid #eee; cursor: pointer; transition: background-color 0.2s; border-radius: 5px; }
        .playlist-item:hover { background-color: #e8f5e9; }
        .playlist-item.active-track { background-color: #d1e7d2; font-weight: bold; }
        .playlist-item .track-number { font-size: 1.1em; color: #777; width: 40px; }
        .playlist-item .track-title { flex-grow: 1; }
        .playlist-item .track-duration { color: #888; font-size: 0.9em; }
        
        footer { text-align: center; margin-top: 30px; padding-top: 20px; border-top: 1px solid #e0e0e0; color: #777; }

        /* --- Responsive Design --- */
        @media (max-width: 768px) {
            .main-player-section { flex-direction: column; text-align: center; }
            .player-info h2 { font-size: 1.4em; }
            .tab-container { justify-content: center; }
        }
        
        /* For Desktop View */
        @media (min-width: 769px) {
            .hamburger-icon { display: none; } /* ซ่อนปุ่ม Hamburger บนจอใหญ่ */
            .sidebar-menu { display: none; } /* ซ่อนเมนู Sidebar บนจอใหญ่ */
            .navbar#desktopNavbar { display: flex; gap: 20px; } /* แสดงเมนูแนวนอนบนจอใหญ่ */
            .navbar#desktopNavbar a { text-decoration: none; color: #333; font-weight: 500; }
        }
    </style>
</head>
<body>

    <header class="site-header">
        <div class="header-container">
            <a href="/" class="logo-link">
                <img src="/assets/images/logo.png" alt="ธรรมสุตตะ" class="site-logo">
                <span class="site-title">ธรรมสุตตะ</span>
            </a>
            <nav class="navbar" id="desktopNavbar">
                <a href="/">หน้าแรก</a>
                <a href="/pages/sutta.html">พระสูตร</a>
                <a href="/pages/abhidhamma.html">พระอภิธรรม</a>
                <a href="/search/index.html">🔍ค้นหา</a>
            </nav>
            <button class="hamburger-icon" id="hamburgerIcon" aria-label="เมนู">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>
        </div>
    </header>

    <nav class="sidebar-menu" id="sidebarMenu">
        <a href="/">🏠หน้าแรก</a>
        <a href="/pages/vinaya.html">🔹พระวินัย</a>
        <a href="/pages/sutta.html">🔹พระสูตร</a>
        <a href="/pages/abhidhamma.html">🔹พระอภิธรรม</a>
        <a href="/pages/katha.html">🔹อรรถกถา</a>
        <a href="/audio/index.html">📻 ฟังธรรมบรรยาย</a>
        <a href="/search/index.html">🔍ค้นหาจากในเว็บ</a>
    </nav>

    <div class="container">
        <header class="page-header">
            <h1>สถานีวิทยุธรรมสุตตะ</h1>
            <p>ธรรมบรรยายโดย พระอาจารย์สมบัติ นันทิโก</p>
        </header>

        <main>
            <section class="main-player-section">
                <div class="album-art">
                    <img id="current-album-art" src="/assets/images/dhammacakka-icon.png" alt="ปกธรรมะ" />
                </div>
                <div class="player-info">
                    <h2 id="current-track-title">เลือกธรรมบรรยายเพื่อเริ่มฟัง</h2>
                    <p id="current-series-name">ยังไม่ได้เลือกหมวดหมู่</p>
                    <audio id="audioPlayer" controls>
                        <source id="audioSource" src="" type="audio/mpeg">
                        เบราว์เซอร์ของคุณไม่รองรับการเล่นเสียง
                    </audio>
                </div>
            </section>

            <section class="playlist-section">
                <div class="tab-container">
                    <button class="tab-link active" data-playlist="buddha">🎧 ชุดพระพุทธเจ้า</button>
                    <button class="tab-link" data-playlist="sutta">🎧 ชุดพระสูตร</button>
                    <button class="tab-link" data-playlist="panna">🎧 ชุดพระปัญญา</button>
                    <button class="tab-link" data-playlist="misc">🎧 อรรถกถาและปกิณกะ</button>
                </div>
                <div id="playlist-view"></div>
            </section>
        </main>

        <footer>
            <p>&copy; ๒๕๖๑ - ปัจจุบัน, ธรรมสุตตะ</p>
        </footer>
    </div>
    
    <script>
    /*
    ==================================================
    === JAVASCRIPT ที่จำเป็นสำหรับ HAMBURGER MENU (สำคัญ) ===
    ==================================================
    */
    document.addEventListener('DOMContentLoaded', function () {
        const hamburgerIcon = document.getElementById('hamburgerIcon');
        const sidebarMenu = document.getElementById('sidebarMenu');

        if (hamburgerIcon && sidebarMenu) {
            hamburgerIcon.addEventListener('click', () => {
                hamburgerIcon.classList.toggle('open');
                sidebarMenu.classList.toggle('open');
            });
        }
    });


    // --- SCRIPT สำหรับ PLAYER และ PLAYLIST ---
    document.addEventListener('DOMContentLoaded', function () {
        const playlists = {
            'buddha': { name: 'ชุดพระพุทธเจ้า', image: '/assets/images/buddha-icon.png', tracks: [ { title: 'พระพุทธเจ้าผู้ทรงคุณ', file: '/audio/buddha/buddha-khun.mp3', duration: '58:12' }, { title: 'พุทธวงศ์', file: '/audio/buddha/buddhawong.mp3', duration: '45:30' } ] },
            'sutta': { name: 'ชุดพระสูตร', image: '/assets/images/dhammacakka-icon.png', tracks: [ { title: 'มงคลสูตร', file: '/audio/sutta/mongkol.mp3', duration: '48:15' }, { title: 'ธนิยสูตร', file: '/audio/sutta/thaniya.mp3', duration: '35:22' } ] },
            'panna': { name: 'ชุดพระปัญญา', image: '/assets/images/bell-icon.png', tracks: [ { title: 'พระอภิธรรม 7 คัมภีร์', file: '/audio/panna/abhidhamma7.mp3', duration: '1:15:00' }, { title: 'สติปัฏฐาน - กายานุปัสสนา', file: '/audio/panna/satipatthana-kaya.mp3', duration: '59:30' } ] },
            'misc': { name: 'อรรถกถาและปกิณกะ', image: '/assets/images/bodhi-icon.png', tracks: [ { title: 'มิลินทปัญหา', file: '/audio/misc/milinda.mp3', duration: '1:30:15' }, { title: 'จริยาปิฎก', file: '/audio/misc/jariya.mp3', duration: '50:45' } ] }
        };

        const audioPlayer = document.getElementById('audioPlayer');
        const audioSource = document.getElementById('audioSource');
        const playlistView = document.getElementById('playlist-view');
        const tabs = document.querySelectorAll('.tab-link');
        const currentTrackTitle = document.getElementById('current-track-title');
        const currentSeriesName = document.getElementById('current-series-name');
        const currentAlbumArt = document.getElementById('current-album-art');
        
        function generatePlaylist(playlistName) {
            const playlist = playlists[playlistName].tracks;
            playlistView.innerHTML = '';
            playlist.forEach((track, index) => {
                const trackElement = document.createElement('div');
                trackElement.className = 'playlist-item';
                trackElement.dataset.index = index;
                trackElement.innerHTML = `<span class="track-number">${index + 1}.</span><span class="track-title">${track.title}</span><span class="track-duration">${track.duration}</span>`;
                trackElement.addEventListener('click', () => playTrack(playlistName, index));
                playlistView.appendChild(trackElement);
            });
        }

        function playTrack(playlistName, trackIndex) {
            const playlistData = playlists[playlistName];
            const trackData = playlistData.tracks[trackIndex];
            audioSource.src = trackData.file;
            currentTrackTitle.textContent = trackData.title;
            currentSeriesName.textContent = `จาก: ${playlistData.name}`;
            currentAlbumArt.src = playlistData.image;
            audioPlayer.load();
            audioPlayer.play();
            updateActiveTrack(trackIndex);
        }

        function updateActiveTrack(activeIndex) {
            document.querySelectorAll('.playlist-item').forEach((track, index) => {
                if (index === activeIndex) {
                    track.classList.add('active-track');
                } else {
                    track.classList.remove('active-track');
                }
            });
        }

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                generatePlaylist(tab.dataset.playlist);
            });
        });

        // Initial load
        generatePlaylist('buddha');
        currentSeriesName.textContent = `หมวดหมู่: ${playlists.buddha.name}`;
        currentAlbumArt.src = playlists.buddha.image;
    });
    </script>
</body>
</html>
