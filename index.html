    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js');
            });
        }
    
        let playlists;
        let allTracks = [];
        let currentTracks = [];
    
        const audio = document.getElementById("audioPlayer");
        const trackList = document.getElementById("trackList");
        const playlistSelect = document.getElementById("playlistSelect");
        const searchInput = document.getElementById("searchInput");
        const statInfo = document.getElementById("statInfo");
        const historyBox = document.getElementById("historyBox");
        const fixedPlayerWrapper = document.querySelector('.fixed-bottom-player-wrapper');
        const rewindBtn = document.getElementById("rewindBtn");
        const forwardBtn = document.getElementById("forwardBtn");

        rewindBtn.addEventListener("click", () => {
            audio.currentTime -= 30;
        });

        forwardBtn.addEventListener("click", () => {
            audio.currentTime += 30;
        });
    
        fetch("playlists.json")
            .then(response => response.json())
            .then(data => {
                playlists = data;
                let totalTracks = 0;
    
                // Populate dropdown and create allTracks array
                Object.keys(playlists).forEach(name => {
                    const option = document.createElement("option");
                    option.value = name;
                    option.textContent = name;
                    playlistSelect.appendChild(option);
                    
                    const tracksInPlaylist = playlists[name];
                    allTracks = allTracks.concat(tracksInPlaylist);
                    totalTracks += tracksInPlaylist.length;
                });
                
                // Set initial context to all tracks for global search
                currentTracks = allTracks;
    
                statInfo.textContent = `🔸 ขณะนี้มีธรรมบรรยายทั้งหมด ${totalTracks.toLocaleString('th-TH')} เรื่อง แบ่งเป็น ${Object.keys(playlists).length.toLocaleString('th-TH')} ชุด `;
    
                const lastTrack = localStorage.getItem("lastTrackUrl");
                if (lastTrack) {
                    fixedPlayerWrapper.style.display = 'flex';
                    audio.src = lastTrack;
                }
    
                showHistory();
            });
    
        playlistSelect.addEventListener("change", function () {
            const selected = this.value;
            if (selected) {
                // If a specific playlist is selected, filter within it
                currentTracks = playlists[selected] || [];
            } else {
                // If the default option is selected, search all tracks
                currentTracks = allTracks;
            }
            searchInput.value = ""; // Clear search input
            showFilteredTracks(""); // Display all tracks from the new context
        });
    
        searchInput.addEventListener("input", () => {
            showFilteredTracks(searchInput.value);
        });
    
        function showFilteredTracks(keyword) {
            trackList.innerHTML = "";
            const filtered = (currentTracks || []).filter(track =>
                track.title.toLowerCase().includes(keyword.toLowerCase())
            );
            
            // Limit the number of results displayed for performance if searching globally
            const displayLimit = (playlistSelect.value === "" && keyword) ? 100 : filtered.length;
            const tracksToDisplay = filtered.slice(0, displayLimit);

            tracksToDisplay.forEach(track => {
                const li = document.createElement("li");
                li.className = "track-item";
    
                const btn = document.createElement("button");
                btn.className = "track-button";
                btn.textContent = `▶️ ${track.title}`;
                btn.onclick = () => {
                    audio.src = track.url;
                    audio.play();
                    localStorage.setItem("lastTrackUrl", track.url);
                    saveHistory(track);
                    showHistory();
                    fixedPlayerWrapper.style.display = 'flex';
                };
    
                li.appendChild(btn);
                trackList.appendChild(li);
            });
            
            if (filtered.length > displayLimit) {
                const moreResultsLi = document.createElement("li");
                moreResultsLi.textContent = `และอีก ${filtered.length - displayLimit} ผลลัพธ์... กรุณาเจาะจงคำค้นหาเพิ่มเติม`;
                moreResultsLi.style.textAlign = "center";
                moreResultsLi.style.color = "#888";
                moreResultsLi.style.marginTop = "10px";
                trackList.appendChild(moreResultsLi);
            }
        }
    
        function saveHistory(track) {
            let history = JSON.parse(localStorage.getItem("history")) || [];
            history = history.filter(t => t.url !== track.url);
            history.unshift({ title: track.title, url: track.url });
            if (history.length > 3) history.pop();
            localStorage.setItem("history", JSON.stringify(history));
        }
    
        function showHistory() {
            const history = JSON.parse(localStorage.getItem("history")) || [];
            if (history.length === 0) {
                historyBox.style.display = "none";
                return;
            }
            historyBox.style.display = "block";
            historyBox.innerHTML = "<strong>🕒 ประวัติการฟัง:</strong><ul style='padding-left: 20px; margin-top: 5px; margin-bottom: 0;'>" +
                history.map(item => `<li><a href="#" onclick="event.preventDefault(); playFromHistory('${item.url}', '${item.title.replace(/'/g, "\\'")}')">${item.title}</a></li>`).join('') +
                "</ul>";
        }
    
        function playFromHistory(url, title) {
            audio.src = url;
            audio.play();
            localStorage.setItem("lastTrackUrl", url);
            fixedPlayerWrapper.style.display = 'flex';
        }
    
        function resumeLastTrack() {
            const lastTrack = localStorage.getItem("lastTrackUrl");
            if (lastTrack) {
                audio.src = lastTrack;
                audio.play();
                fixedPlayerWrapper.style.display = 'flex';
            } else {
                alert("ยังไม่มีรายการที่ฟังล่าสุด");
            }
        }
    </script>
    <script>
  const player = document.getElementById("audioPlayer");
  const storageKey = "audio-position";

  // โหลดตำแหน่งเก่า
  window.addEventListener("load", () => {
    const lastPos = localStorage.getItem(storageKey);
    if (lastPos) {
      player.currentTime = parseFloat(lastPos);
    }
  });

  // บันทึกตำแหน่งปัจจุบันทุก 1 วินาที
  player.addEventListener("timeupdate", () => {
    localStorage.setItem(storageKey, player.currentTime);
  });
</script>

    <script>
        // Script for tag index page generation
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('alphabetical-tag-container');
            if (!container) return; // Only run if the container exists
            const dataUrl = '/assets/data/tags.json';
    
            fetch(dataUrl)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(posts => {
                    const allTags = new Set();
                    posts.forEach(post => {
                        if (post.tags && Array.isArray(post.tags)) {
                            post.tags.forEach(tag => allTags.add(tag.trim()));
                        }
                    });
    
                    const sortedTags = Array.from(allTags).sort((a, b) => a.localeCompare(b, 'th'));
    
                    if (sortedTags.length === 0) {
                        container.innerHTML = '<p class="loading-message">ยังไม่มีป้ายกำกับในระบบ</p>';
                        return;
                    }
    
                    const groupedTags = sortedTags.reduce((acc, tag) => {
                        const firstLetter = tag[0];
                        if (!acc[firstLetter]) {
                            acc[firstLetter] = [];
                        }
                        acc[firstLetter].push(tag);
                        return acc;
                    }, {});
    
                    container.innerHTML = '';
                    for (const letter in groupedTags) {
                        const groupSection = document.createElement('section');
                        groupSection.className = 'tag-group';
                        const header = document.createElement('h2');
                        header.className = 'tag-group-header';
                        header.textContent = letter;
                        groupSection.appendChild(header);
                        const linksDiv = document.createElement('div');
                        linksDiv.className = 'tag-links';
                        groupedTags[letter].forEach(tag => {
                            const link = document.createElement('a');
                            link.className = 'tag-item';
                            link.href = `/tags/${encodeURIComponent(tag)}.html`;
                            link.textContent = tag;
                            linksDiv.appendChild(link);
                        });
                        groupSection.appendChild(linksDiv);
                        container.appendChild(groupSection);
                    }
                })
                .catch(error => {
                    console.error('Error fetching or processing tags:', error);
                    container.innerHTML = '<p class="error-message">เกิดข้อผิดพลาดในการโหลดข้อมูลป้ายกำกับ</p>';
                });
        });
    </script>
