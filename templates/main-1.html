<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>หน้าทดสอบ Dropdown</title>
    <style>
        body { font-family: 'Sarabun', sans-serif; line-height: 1.6; color: #333; }
        .page-wrapper { max-width: 800px; margin: 20px auto; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
        .section-title-new { text-align: center; color: #2e8b57; }
        select { width: 100%; padding: 10px; font-size: 1em; margin-bottom: 15px; }
        .vb-output { border: 1px solid #eee; background-color: #f9f9f9; padding: 15px; min-height: 100px; border-radius: 5px;}
    </style>
</head>
<body>
<div class="page-wrapper">

    <main>
        <div class="main-content">
            <section class="scripture-explorer" id="scripture-explorer">
                <h2 class="section-title-new">คัมภีร์ในพระไตรปิฎก</h2>
                <div class="vb-frame">
                    <center>
                        <label for="bookSelect"><h3>เลือกตามชื่อคัมภีร์:</h3></label>
                        <select id="bookSelect">
                            <option value="">-- ค้นหาตามชื่อ --</option>
                        </select>
                    </center>
                    <br>
                    <div id="bookOutput" class="vb-output">
                        กรุณาเลือกเพื่อดูรายละเอียดและคำอธิบายเบื้องต้น
                    </div>
                </div>
            </section>
        </div>
    </main>
    
    <footer>
        <p style="text-align:center; margin-top: 20px;">- <a href="/">กลับหน้าแรก</a> -</p>
    </footer>

</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    
    const bookSelect = document.getElementById('bookSelect');
    const bookOutput = document.getElementById('bookOutput');

    // ตรวจสอบว่ามี element นี้ในหน้าเว็บหรือไม่
    if (bookSelect && bookOutput) {
        let allBooksData = []; // สร้างตัวแปรเพื่อเก็บข้อมูลหนังสือทั้งหมด

        // 1. โหลดข้อมูลจากไฟล์ books.json
        // *** จุดสำคัญ: เปลี่ยน Path เป็น ../ เพื่อถอยออกจากโฟลเดอร์ templates ก่อน ***
        fetch('../assets/data/books.json')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok ' + response.statusText);
                }
                return response.json();
            })
            .then(data => {
                allBooksData = data; // เก็บข้อมูลไว้ในตัวแปร
                
                // 2. สร้างตัวเลือก <option> ใน dropdown
                allBooksData.forEach(book => {
                    const option = document.createElement('option');
                    option.value = book.id;
                    option.textContent = book.name; // ใช้ 'name' ตามไฟล์ JSON ของคุณ
                    bookSelect.appendChild(option);
                });
            })
            .catch(error => {
                console.error('ไม่สามารถโหลดข้อมูลคัมภีร์ได้:', error);
                bookOutput.innerHTML = `<p style="color:red;"><strong>เกิดข้อผิดพลาด:</strong> ไม่สามารถโหลดไฟล์ข้อมูลได้ กรุณาตรวจสอบว่าที่อยู่ไฟล์ '../assets/data/books.json' ถูกต้อง</p>`;
            });

        // 3. เพิ่ม Event Listener เพื่อรอรับการเลือกจากผู้ใช้
        bookSelect.addEventListener('change', function() {
            const selectedId = this.value; // ดึงค่า value ของ option ที่ถูกเลือก

            if (selectedId) {
                // ค้นหาข้อมูลหนังสือจาก id ที่เลือก
                const selectedBook = allBooksData.find(book => book.id === selectedId);
                
                if (selectedBook) {
                    // แสดงผลในกล่อง bookOutput
                    bookOutput.innerHTML = `
                        <h3>${selectedBook.name} (${selectedBook.label})</h3>
                        <div>${selectedBook.desc}</div>
                    `;
                }
            } else {
                // ถ้าผู้ใช้เลือก "-- ค้นหาตามชื่อ --" ให้กลับเป็นข้อความเริ่มต้น
                bookOutput.innerHTML = 'กรุณาเลือกเพื่อดูรายละเอียดและคำอธิบายเบื้องต้น';
            }
        });
    }
});
</script>
<div id="footer-placeholder"></div>
    
    <script src="/assets/js/main.js"></script>

</body>
</html>
