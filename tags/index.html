
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="/assets/images/favicon.png" sizes="32x32">
  
  <title>ธรรมสุตตะ | รวมป้ายกำกับ</title>
  <meta name="description" content="คลังธรรมะออนไลน์ พระไตรปิฎก วินัยสงฆ์ ธรรมบท พุทธวจนะ เรียบง่ายแต่ครบถ้วน" />
  <meta name="keywords" content="ธรรมะ, พระไตรปิฎก, ธรรมบท, พุทธวจนะ, วินัยสงฆ์, ป้ายกำกับ, tags" />
  <meta name="author" content="ธรรมสุตตะ" />
  
  <link rel="stylesheet" href="/assets/css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;700&display=swap" rel="stylesheet" />

  <style>
    /* 1. CSS Reset & Base Styles (โค้ดเดิม) */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Sarabun', sans-serif;
      background-color: #f4f4f9;
      color: #333;
      line-height: 1.6; /* ปรับปรุงให้อ่านง่ายขึ้น */
    }
    .page-wrapper {
      max-width: 800px;
      margin: 0 auto;
      padding: 10px;
      box-sizing: border-box;
    }
    .content-wrapper {
      max-width: 800px;
      margin: 2rem auto;
      padding: 2rem;
      background-color: #ffffff;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }
    h1 {
      text-align: center;
      color: #2c3e50;
      font-weight: 700;
      margin-bottom: 0.5rem; /* ลดระยะห่างเล็กน้อย */
    }
    hr {
        border: none;
        border-top: 1px solid #ecf0f1;
        margin: 1.5rem 0;
    }

    /* --- 🔷 CSS สำหรับหน้ารวมป้ายกำกับ (Tag) ที่ออกแบบใหม่ --- */
    #alphabetical-tag-container {
        margin-top: 1.5rem;
    }

    .tag-group {
        margin-bottom: 2rem; /* ระยะห่างระหว่างหมวดตัวอักษร */
    }

    .tag-group-header {
        font-size: 1.8rem;
        font-weight: 700;
        color: #3498db;
        border-bottom: 2px solid #ecf0f1;
        padding-bottom: 0.5rem;
        margin-bottom: 1rem;
    }

    .tag-links {
        display: flex;
        flex-wrap: wrap;
        gap: 12px; /* ระยะห่างระหว่างแท็ก */
    }

    .tag-item {
        display: inline-block;
        background-color: #ecf0f1; /* สีพื้นหลังแท็ก */
        color: #34495e; /* สีตัวอักษร */
        padding: 8px 16px;
        border-radius: 10px; /* ทำให้ขอบมนสวย */
        font-size: 1rem;
        font-weight: 500;
        text-decoration: none;
        transition: all 0.2s ease-in-out;
        border: 1px solid transparent;
    }

    .tag-item:hover {
        background-color: #3498db; /* สีพื้นหลังเมื่อเมาส์ชี้ */
        color: #ffffff; /* สีตัวอักษรเมื่อเมาส์ชี้ */
        transform: translateY(-2px);
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        text-decoration: none;
    }
    
    .loading-message, .error-message {
        text-align: center;
        padding: 3rem 0;
        color: #7f8c8d;
        font-size: 1.1rem;
    }

  </style>
</head>
<body>

 <div class="page-wrapper">
<div id="nav-placeholder"></div>
    

        <h1>รวมป้ายกำกับ</h1>
        <p style="text-align: center; color: #555;">เลือกป้ายกำกับที่สนใจ เพื่อค้นหาบทความที่เกี่ยวข้องทั้งหมด</p>
        <hr>

        <div id="alphabetical-tag-container">
            <p class="loading-message">กำลังโหลดรายการป้ายกำกับ...</p>
        </div>
    </main>

   <div id="footer-placeholder"></div>

   <script src="/assets/js/main.js"></script>
 

  <script>
    // Script สำหรับ Hamburger Menu (เหมือนเดิม)
    const hamburgerIcon = document.getElementById('hamburgerIcon');
    const sidebarMenu = document.getElementById('sidebarMenu');
    if (hamburgerIcon && sidebarMenu) {
        hamburgerIcon.addEventListener('click', () => {
            hamburgerIcon.classList.toggle('open');
            sidebarMenu.classList.toggle('open');
        });
    }
  </script>

  <script>
    // --- 🔷 สคริปต์หลักสำหรับสร้างหน้ารวมป้ายกำกับ (Tag) ---
    document.addEventListener('DOMContentLoaded', () => {
        const container = document.getElementById('alphabetical-tag-container');
        
        // สมมติว่าไฟล์ tags.json มีโครงสร้างเป็น Array ของ Object 
        // ที่แต่ละ Object คือ "บทความ" ซึ่งมี key ชื่อ "tags" เป็น Array ของ string
        // เช่น: [{ "title": "...", "url": "...", "tags": ["กรรม", "กิเลส"] }, ...]
        const dataUrl = '/assets/data/tags.json';

        fetch(dataUrl)
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.json();
            })
            .then(posts => {
                // 1. รวบรวม Tag ทั้งหมดที่ไม่ซ้ำกัน
                const allTags = new Set();
                posts.forEach(post => {
                    if (post.tags && Array.isArray(post.tags)) {
                        post.tags.forEach(tag => allTags.add(tag.trim()));
                    }
                });

                // 2. แปลง Set เป็น Array และเรียงลำดับตามตัวอักษรไทย
                const sortedTags = Array.from(allTags).sort((a, b) => a.localeCompare(b, 'th'));

                if (sortedTags.length === 0) {
                    container.innerHTML = '<p class="loading-message">ยังไม่มีป้ายกำกับในระบบ</p>';
                    return;
                }
                
                // 3. จัดกลุ่ม Tag ตามพยัญชนะตัวแรก
                const groupedTags = sortedTags.reduce((acc, tag) => {
                    const firstLetter = tag[0];
                    if (!acc[firstLetter]) {
                        acc[firstLetter] = [];
                    }
                    acc[firstLetter].push(tag);
                    return acc;
                }, {});

                // 4. สร้าง HTML แล้วนำไปแสดงผล
                container.innerHTML = ''; // เคลียร์ข้อความ "กำลังโหลด..." ออก
                
                for (const letter in groupedTags) {
                    // สร้าง Section ของแต่ละตัวอักษร
                    const groupSection = document.createElement('section');
                    groupSection.className = 'tag-group';

                    // สร้างหัวข้อตัวอักษร (เช่น ก, ข, ค)
                    const header = document.createElement('h2');
                    header.className = 'tag-group-header';
                    header.textContent = letter;
                    groupSection.appendChild(header);

                    // สร้าง Container สำหรับเก็บลิงก์แท็ก
                    const linksDiv = document.createElement('div');
                    linksDiv.className = 'tag-links';
                    
                    // สร้างลิงก์สำหรับแต่ละแท็กในกลุ่ม
                    groupedTags[letter].forEach(tag => {
                        const link = document.createElement('a');
                        link.className = 'tag-item';
                        link.href = `/tags/${encodeURIComponent(tag)}.html`; // สร้าง URL แบบ δυναμικά
                        link.textContent = tag;
                        linksDiv.appendChild(link);
                    });

                    groupSection.appendChild(linksDiv);
                    container.appendChild(groupSection);
                }
            })
            .catch(error => {
                console.error('Error fetching or processing tags:', error);
                container.innerHTML = '<p class="error-message">เกิดข้อผิดพลาดในการโหลดข้อมูลป้ายกำกับ</p>';
            });
    });
  </script>

</body>
</html>
