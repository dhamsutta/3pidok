<script>
// 1. ระบุชื่อแท็กของหน้านี้
const currentTag = "กรรมฐาน"; 

// 2. สคริปต์สำหรับโหลดและแสดงบทความตามแท็ก
document.addEventListener('DOMContentLoaded', () => {
  const listElement = document.getElementById('tag-list');

  // ตรวจสอบว่า Element ที่จะแสดงผลมีอยู่จริงหรือไม่
  if (!listElement) {
    console.error('Error: Element with id "tag-list" not found.');
    return;
  }

  // แสดงข้อความว่ากำลังโหลด
  listElement.innerHTML = '<li>กำลังโหลดข้อมูล...</li>'; 

  fetch('/assets/data/tags.json')
    .then(response => {
      // ตรวจสอบว่าโหลดไฟล์สำเร็จหรือไม่
      if (!response.ok) {
        throw new Error(`HTTP error! Status: ${response.status}`);
      }
      return response.json();
    })
    .then(allPosts => {
      // กรองข้อมูลเฉพาะบทความที่มีแท็กตรงกับ currentTag
      const filteredPosts = allPosts.filter(post => post.tags && post.tags.includes(currentTag));

      // เคลียร์ข้อความ "กำลังโหลด..." ออก
      listElement.innerHTML = '';

      if (filteredPosts.length === 0) {
        // กรณีไม่พบบทความในแท็กนี้
        listElement.innerHTML = `<li>ยังไม่มีบทความในป้ายกำกับ "${currentTag}"</li>`;
      } else {
        // กรณีพบบทความ
        const countMessage = document.createElement('li');
        countMessage.textContent = `พบ ${filteredPosts.length} บทความในป้ายกำกับนี้:`;
        countMessage.style.borderBottom = "none"; // ไม่ต้องมีเส้นคั่นสำหรับข้อความบอกจำนวน
        countMessage.style.fontWeight = "bold";
        countMessage.style.marginBottom = "1rem";
        listElement.appendChild(countMessage);

        // วนลูปสร้างรายการบทความ
        filteredPosts.forEach(post => {
          const listItem = document.createElement('li');
          listItem.innerHTML = `<a href="${post.url}">${post.title}</a><small>${post.description}</small>`;
          listElement.appendChild(listItem);
        });
      }
    })
    .catch(error => {
      console.error('Error fetching or processing tag data:', error);
      // หากเกิดข้อผิดพลาดในการโหลด
      if (listElement) {
        listElement.innerHTML = '<li style="color: red;">เกิดข้อผิดพลาดในการโหลดข้อมูล</li>';
      }
    });
});
</script>

<script src="/assets/js/main.js"></script>
