    <script>
        // Script สำหรับ Hamburger Menu
        const hamburgerIcon = document.getElementById('hamburgerIcon');
        const sidebarMenu = document.getElementById('sidebarMenu');
        const mainContainer = document.querySelector('main.container');

        if (hamburgerIcon && sidebarMenu) {
            hamburgerIcon.addEventListener('click', () => {
                hamburgerIcon.classList.toggle('open');
                sidebarMenu.classList.toggle('open');
            });
        }

        // --- โค้ดสำหรับ Quote และ Pali Dictionary (เหมือนเดิม) ---
        fetch('/assets/data/quotes.json')
            .then(res => res.json())
            .then(data => {
                const quote = data[Math.floor(Math.random() * data.length)];
                const quoteElement = document.getElementById('random-quote');
                if(quoteElement) {
                    quoteElement.innerHTML = `“${quote.quote}” <br><small>— ${quote.source}</small>`;
                }
            })
            .catch(() => {
                const quoteElement = document.getElementById('random-quote');
                if(quoteElement) {
                    quoteElement.innerText = "ไม่สามารถโหลดพุทธพจน์ได้";
                }
            });

        let paliDict = [];
        fetch('/assets/data/pali.json')
            .then(res => res.json())
            .then(data => { paliDict = data; })
            .catch(() => {
                const paliResult = document.getElementById('paliResult');
                if(paliResult) {
                    paliResult.innerText = "❌ โหลดพจนานุกรมไม่สำเร็จ";
                }
            });

        const paliInput = document.getElementById('paliInput');
        if (paliInput) {
            paliInput.addEventListener('input', function () {
                const input = this.value.trim().toLowerCase();
                const resultBox = document.getElementById('paliResult');
                if (!input) {
                    resultBox.innerHTML = '';
                    resultBox.style.display = 'none';
                    return;
                }
                const matches = paliDict.filter(entry => entry.headword.toLowerCase().includes(input));
                resultBox.style.display = 'block';
                resultBox.innerHTML = matches.length
                    ? matches.slice(0, 10).map(entry => `<p><strong>${entry.headword}</strong>: ${entry.content}</p>`).join('')
                    : `<p class="no-match">ไม่พบคำว่า "<strong>${input}</strong>"</p>`;
            });
        }
    </script>


<script>
document.addEventListener("DOMContentLoaded", function () {
  const input = document.getElementById("paliInput");
  const section = document.querySelector(".dictionary-section");

  if (input && section) {
    input.addEventListener("input", function () {
      section.scrollIntoView({ behavior: "smooth", block: "start" });
    });
  }
});
</script>




     

  <script>
    // ไม่ต้องแก้ไขส่วนนี้ การทำงานเหมือนเดิม
    fetch('/assets/data/tags.json')
      .then(response => response.json())
      .then(data => {
        const tagName = 'วินัย'; // ระบุแท็กของหน้านี้
        const list = document.getElementById('tag-list');

        // หากไม่มีข้อมูล ให้แสดงข้อความ
        const filteredData = data.filter(post => post.tags.includes(tagName));
        if (filteredData.length === 0) {
            const li = document.createElement('li');
            li.textContent = 'ยังไม่มีบทความในแท็กนี้';
            list.appendChild(li);
            return;
        }

        filteredData.forEach(post => {
            const li = document.createElement('li');
            // ปรับการสร้าง HTML เล็กน้อยเพื่อให้ <small> จัดการง่ายขึ้น
            li.innerHTML = `<a href="${post.url}">${post.title}</a><small>${post.description}</small>`;
            list.appendChild(li);
          });
      })
      .catch(error => {
        console.error('Error fetching data:', error);
        const list = document.getElementById('tag-list');
        const li = document.createElement('li');
        li.textContent = 'เกิดข้อผิดพลาดในการโหลดข้อมูล';
        li.style.color = 'red';
        list.appendChild(li);
      });
  </script>
