<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>บทความแท็ก: วินัย</title>
  <meta name="description" content="รวมบทความแท็ก วินัย">
</head>
<body>
  <h1>บทความแท็ก: วินัย</h1>
  <ul id="tag-list"></ul>

  <script>
  fetch('/assets/data/tags.json')
    .then(response => response.json())
    .then(data => {
      const tagName = 'วินัย'; // ระบุแท็กของหน้านี้
      const list = document.getElementById('tag-list');
      data.filter(post => post.tags.includes(tagName))
          .forEach(post => {
            const li = document.createElement('li');
            li.innerHTML = `<a href="${post.url}">${post.title}</a><br><small>${post.description}</small>`;
            list.appendChild(li);
          });
    });
  </script>
</body>
</html>
