<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>บทความแท็ก: วินัย</title>
  <meta name="description" content="รวมบทความแท็ก วินัย">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    /* 1. CSS Reset & Base Styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Sarabun', sans-serif;
      background-color: #f4f4f9; /* สีพื้นหลังเทาอ่อน */
      color: #333;
      line-height: 1.6; /* ปรับระยะห่างระหว่างบรรทัดให้อ่านง่าย */
    }

    /* 2. Content Wrapper */
    .content-wrapper {
      max-width: 800px;
      margin: 2rem auto; /* จัดกึ่งกลางและเว้นระยะจากขอบบน/ล่าง */
      padding: 2rem;
      background-color: #ffffff; /* พื้นหลังส่วนเนื้อหาสีขาว */
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }
    
    /* 3. Typography & Header */
    h1 {
      text-align: center;
      color: #2c3e50; /* สีน้ำเงินเข้มเกือบดำ */
      font-weight: 700;
      margin-bottom: 1.5rem; /* เว้นระยะใต้หัวข้อเล็กน้อย */
      border-bottom: 2px solid #3498db; /* เส้นคั่นใต้หัวข้อ */
      padding-bottom: 0.5rem;
    }

    /* 4. Article List Styling */
    #tag-list {
      list-style-type: none; /* เอา bullet point ออก */
    }

    #tag-list li {
      padding: 1rem 0; /* เพิ่มระยะห่างภายในบน-ล่างของแต่ละรายการ */
      border-bottom: 1px solid #ecf0f1; /* เส้นคั่นบางๆ ระหว่างรายการ */
    }

    #tag-list li:last-child {
      border-bottom: none; /* รายการสุดท้ายไม่ต้องมีเส้นคั่น */
    }

    #tag-list a {
      font-size: 1.2rem; /* ขนาดตัวอักษรของชื่อบทความ */
      font-weight: 700; /* ตัวหนา */
      color: #3498db; /* สีฟ้าสำหรับลิงก์ */
      text-decoration: none;
      transition: color 0.2s ease-in-out;
    }

    #tag-list a:hover {
      color: #2980b9; /* สีเข้มขึ้นเมื่อเมาส์ชี้ */
      text-decoration: underline;
    }

    #tag-list small {
      display: block; /* ทำให้ <small> ขึ้นบรรทัดใหม่เสมอ (เหมือน <br>) */
      font-size: 0.95rem;
      color: #555; /* สีเทาเข้มสำหรับคำอธิบาย */
      margin-top: 4px; /* เว้นระยะจากชื่อบทความเล็กน้อย */
    }
  </style>
</head>
<body>

  <div class="content-wrapper">
    <h1>บทความแท็ก: วินัย</h1>
    <ul id="tag-list"></ul>
  </div>

  <script>
    // ไม่ต้องแก้ไขส่วนนี้ การทำงานเหมือนเดิม
    fetch('/assets/data/tags.json')
      .then(response => response.json())
      .then(data => {
        const tagName = 'วินัย'; // ระบุแท็กของหน้านี้
        const list = document.getElementById('tag-list');

        // หากไม่มีข้อมูล ให้แสดงข้อความ
        const filteredData = data.filter(post => post.tags.includes(tagName));
        if (filteredData.length === 0) {
            const li = document.createElement('li');
            li.textContent = 'ยังไม่มีบทความในแท็กนี้';
            list.appendChild(li);
            return;
        }

        filteredData.forEach(post => {
            const li = document.createElement('li');
            // ปรับการสร้าง HTML เล็กน้อยเพื่อให้ <small> จัดการง่ายขึ้น
            li.innerHTML = `<a href="${post.url}">${post.title}</a><small>${post.description}</small>`;
            list.appendChild(li);
          });
      })
      .catch(error => {
        console.error('Error fetching data:', error);
        const list = document.getElementById('tag-list');
        const li = document.createElement('li');
        li.textContent = 'เกิดข้อผิดพลาดในการโหลดข้อมูล';
        li.style.color = 'red';
        list.appendChild(li);
      });
  </script>

</body>
</html>
